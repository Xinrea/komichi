server {
    listen 80;
    listen [::]:80;

    server_name komichi.cn www.komichi.cn;
    root /var/www/html/komichi;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WASM must be served as a binary, never the SPA's index.html fallback.
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|json|lrc|mp3|m4a|ogg|wav|flac|otf|ttf)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:png|svg|ico|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
