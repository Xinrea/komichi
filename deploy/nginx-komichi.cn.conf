server {
    listen 80;
    listen [::]:80;

    server_name komichi.cn www.komichi.cn;
    root /var/www/html/komichi;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:png|svg|ico|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
